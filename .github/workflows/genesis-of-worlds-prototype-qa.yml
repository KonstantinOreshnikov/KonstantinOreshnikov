name: Genesis of Worlds prototype QA
on:
  pull_request:
    paths:
      - 'projects/independent-game-studio/games/genesis-of-worlds/**'
      - '.github/workflows/genesis-of-worlds-prototype-qa.yml'
jobs:
  mars-prototype:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/independent-game-studio/games/genesis-of-worlds
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/engine.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-of-worlds-v0.1-browser-screenshots
          path: projects/independent-game-studio/games/genesis-of-worlds/qa-screenshots/
          if-no-files-found: ignore
