        working-directory: projects/independent-game-studio/games/chess-odyssey
        run: |
          node tests/clock-core.cjs
          node tests/p0p2-ui-core.cjs
          node tests/v1-auth-boundary.cjs
          node tests/v1-cloud-api.cjs
          node tests/v1-cloud-client-contract.cjs
          node tests/v1-pvp-cloud.cjs
          node tests/b8-translation-structure.cjs
          node tests/b9-match-service.cjs
          node tests/b9-http.cjs
          node tests/chess-smoke.cjs
          node tests/coach-engine.cjs
          node tests/engine-bridge.cjs
          node tests/academy-content.cjs
          node tests/masters-content.cjs
          node tests/progress-content.cjs
          node tests/release-rules.cjs
          node tests/stockfish-uci.cjs
          node tests/postgame-smoke.cjs
          node tests/dom-smoke.cjs
  browser:
    name: Chromium real UI E2E
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test runner
        working-directory: projects/independent-game-studio/games/chess-odyssey
        run: npm install --no-audit --no-fund --no-save playwright@1.57.0 @axe-core/playwright@4.10.2
      - name: Detect preinstalled Chrome or install Chromium
        working-directory: projects/independent-game-studio/games/chess-odyssey
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "CHESS_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "Preinstalled Chrome absent: installing Playwright Chromium"
            npx playwright install chromium
          fi
      - name: Run browser regression
        working-directory: projects/independent-game-studio/games/chess-odyssey
        run: |
          node scripts/build-standalone.cjs 0.7.0
          node scripts/build-standalone.cjs 0.8.0
          node scripts/build-standalone.cjs 0.9.0
          node tests/p0p2-browser.cjs
          node tests/browser.cjs
          node tests/stockfish-browser.cjs
          node tests/academy-browser.cjs
          node tests/masters-browser.cjs
          node tests/progress-browser.cjs
          node tests/release-browser.cjs
          node tests/release-live-match-browser.cjs
          node tests/release-accessibility.cjs
          node tests/b8-clock-browser.cjs
          node tests/b9-browser.cjs
      - name: Build and verify Stockfish preview ZIP with full GPL license
        working-directory: projects/independent-game-studio/games/chess-odyssey
        run: python3 scripts/package-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChessOdyssey-v0.9.0-UX-GameReview-Development-PREVIEW
          path: projects/independent-game-studio/games/chess-odyssey/dist/ChessOdyssey_v0.9.0_Stockfish_Preview.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows actual .cmd launcher + localhost Stockfish smoke
    needs: browser
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ChessOdyssey-v0.9.0-UX-GameReview-Development-PREVIEW
          path: ${{ runner.temp }}\chess-artifact
      - name: Execute packaged Windows launcher, verify loopback, GPL and genuine WASM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Get-ChildItem (Join-Path $env:RUNNER_TEMP 'chess-artifact') -Filter '*.zip' | Select-Object -First 1
          if (!$zip) { throw 'GitHub Actions artifact inner ZIP missing' }
          $folder=Join-Path $env:RUNNER_TEMP 'chess-release'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $folder -Force
          $game=Join-Path $folder 'ChessOdyssey_v0.9.0'
          if (!(Test-Path (Join-Path $game 'START_WINDOWS.cmd'))) { throw 'Windows launch script absent' }
          if (!(Test-Path (Join-Path $game 'engine\Copying.txt'))) { throw 'GPL license missing' }
          if (!(Test-Path (Join-Path $game 'engine\stockfish-19-lite-single.wasm'))) { throw 'Stockfish binary missing' }
          $startup=Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','START_WINDOWS.cmd' -WorkingDirectory $game -PassThru -WindowStyle Hidden
          try {
            $ready=$false
            for($i=0;$i -lt 22;$i++){
              Start-Sleep -Seconds 1
              try {
                $response=Invoke-WebRequest -Uri 'http://127.0.0.1:8765/index.html' -TimeoutSec 3 -UseBasicParsing
                if($response.StatusCode -eq 200 -and $response.Content -match 'Chess Odyssey'){ $ready=$true;break }
              }catch {}
            }
            if (!$ready) { throw 'Windows .cmd failed to serve localhost index.html' }
            $sockets=Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction Stop
            if (@($sockets | Where-Object { $_.LocalAddress -eq '127.0.0.1' }).Count -lt 1){throw 'No 127.0.0.1 listener'}
            if (@($sockets | Where-Object { $_.LocalAddress -in @('0.0.0.0','::') }).Count -gt 0){throw 'Public listening interface unexpectedly enabled'}
            $progress=Invoke-WebRequest -Uri 'http://127.0.0.1:8765/progress-core.js' -TimeoutSec 5 -UseBasicParsing
            if($progress.StatusCode -ne 200 -or $progress.Content -notmatch 'ChessProgressCore'){throw 'B6 progress asset unavailable'}
            $wasm=Invoke-WebRequest -Uri 'http://127.0.0.1:8765/engine/stockfish-19-lite-single.wasm' -TimeoutSec 5 -UseBasicParsing
            if($wasm.StatusCode -ne 200 -or $wasm.RawContentLength -lt 1000000){throw 'Real Stockfish WASM not served'}
            Write-Output 'PASS B7 actual Windows launcher, loopback-only HTTP, GPL and WASM 1 / 1'
          }finally{
            $listeners=Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue
            foreach($pidItem in @($listeners | Select-Object -ExpandProperty OwningProcess -Unique)){
              if($pidItem -gt 0){Stop-Process -Id $pidItem -Force -ErrorAction SilentlyContinue}
            }
            if($startup -and !$startup.HasExited){Stop-Process -Id $startup.Id -Force -ErrorAction SilentlyContinue}
          }
