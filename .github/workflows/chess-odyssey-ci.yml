  unit:
    name: Offline rules + app smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check projects/independent-game-studio/games/chess-odyssey/vendor/chess.js
          node --check projects/independent-game-studio/games/chess-odyssey/app.js
          node --check projects/independent-game-studio/games/chess-odyssey/clock-core.js
          node --check projects/independent-game-studio/games/chess-odyssey/chess-appearance.js
          node --check projects/independent-game-studio/games/chess-odyssey/game-review-core.js
          node --check projects/independent-game-studio/games/chess-odyssey/tests/p0p2-ui-core.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/p0p2-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/clock-core.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/pvp/match-service.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/pvp/dev-server.cjs
