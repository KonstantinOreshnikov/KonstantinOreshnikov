name: Chess Odyssey QA
on:
  push:
    branches:
      - "game/chess-odyssey-v0.1"
    paths:
      - "projects/chess-odyssey/index.html"
      - "projects/chess-odyssey/styles.css"
      - "projects/chess-odyssey/app.js"
      - "projects/chess-odyssey/coach-engine.js"
      - "projects/chess-odyssey/engine-bridge.js"
      - "projects/chess-odyssey/academy.js"
      - "projects/chess-odyssey/masters-*.js"
      - "projects/chess-odyssey/data/masters-source-scores.json"
      - "projects/chess-odyssey/engine/**"
      - "projects/chess-odyssey/scripts/build-standalone.cjs"
      - "projects/chess-odyssey/scripts/package-preview.py"
      - "projects/chess-odyssey/scripts/serve-local.cjs"
      - "projects/chess-odyssey/START_WINDOWS.cmd"
      - "projects/chess-odyssey/vendor/**"
      - "projects/chess-odyssey/tests/**"
      - ".github/workflows/chess-odyssey-ci.yml"
  pull_request:
    branches:
      - "docs/retro-strategy-ux-aeii-foundation-20261119"
    paths:
      - "projects/chess-odyssey/index.html"
      - "projects/chess-odyssey/styles.css"
      - "projects/chess-odyssey/app.js"
      - "projects/chess-odyssey/coach-engine.js"
      - "projects/chess-odyssey/engine-bridge.js"
      - "projects/chess-odyssey/academy.js"
      - "projects/chess-odyssey/masters-*.js"
      - "projects/chess-odyssey/data/masters-source-scores.json"
      - "projects/chess-odyssey/engine/**"
      - "projects/chess-odyssey/scripts/build-standalone.cjs"
      - "projects/chess-odyssey/scripts/package-preview.py"
      - "projects/chess-odyssey/scripts/serve-local.cjs"
      - "projects/chess-odyssey/START_WINDOWS.cmd"
      - "projects/chess-odyssey/vendor/**"
      - "projects/chess-odyssey/tests/**"
      - ".github/workflows/chess-odyssey-ci.yml"
  workflow_dispatch:
concurrency:
  group: chess-odyssey-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    name: Offline rules + app smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check projects/chess-odyssey/vendor/chess.js
          node --check projects/chess-odyssey/app.js
          node --check projects/chess-odyssey/coach-engine.js
          node --check projects/chess-odyssey/engine-bridge.js
          node --check projects/chess-odyssey/academy.js
          node --check projects/chess-odyssey/masters-library.js
          node --check projects/chess-odyssey/masters-notes-a.js
          node --check projects/chess-odyssey/masters-notes-b.js
          node --check projects/chess-odyssey/masters-notes-c.js
          node --check projects/chess-odyssey/masters-core.js
          node --check projects/chess-odyssey/masters-ui.js
          node --check projects/chess-odyssey/tests/masters-content.cjs
          node --check projects/chess-odyssey/tests/masters-browser.cjs
          node --check projects/chess-odyssey/tests/academy-content.cjs
          node --check projects/chess-odyssey/tests/academy-browser.cjs
          node --check projects/chess-odyssey/scripts/build-standalone.cjs
          node --check projects/chess-odyssey/scripts/serve-local.cjs
          python3 -m py_compile projects/chess-odyssey/scripts/package-preview.py
          node --check projects/chess-odyssey/tests/engine-bridge.cjs
          node --check projects/chess-odyssey/tests/stockfish-uci.cjs
          node --check projects/chess-odyssey/tests/stockfish-browser.cjs
          node --check projects/chess-odyssey/tests/coach-engine.cjs
          node --check projects/chess-odyssey/tests/postgame-smoke.cjs
          node --check projects/chess-odyssey/tests/chess-smoke.cjs
          node --check projects/chess-odyssey/tests/dom-smoke.cjs
          node --check projects/chess-odyssey/tests/browser.cjs
      - name: Unit and integration
        working-directory: projects/chess-odyssey
        run: |
          node tests/chess-smoke.cjs
          node tests/coach-engine.cjs
          node tests/engine-bridge.cjs
          node tests/academy-content.cjs
          node tests/masters-content.cjs
          node tests/stockfish-uci.cjs
          node tests/postgame-smoke.cjs
          node tests/dom-smoke.cjs
  browser:
    name: Chromium real UI E2E
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned test runner
        working-directory: projects/chess-odyssey
        run: npm install --no-audit --no-fund --no-save playwright@1.57.0
      - name: Detect preinstalled Chrome or install Chromium
        working-directory: projects/chess-odyssey
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "CHESS_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            echo "Preinstalled Chrome absent: installing Playwright Chromium"
            npx playwright install chromium
          fi
      - name: Run browser regression
        working-directory: projects/chess-odyssey
        run: |
          node scripts/build-standalone.cjs 0.5.0
          node tests/browser.cjs
          node tests/stockfish-browser.cjs
          node tests/academy-browser.cjs
          node tests/masters-browser.cjs
      - name: Build and verify Stockfish preview ZIP with full GPL license
        working-directory: projects/chess-odyssey
        run: python3 scripts/package-preview.py
      - uses: actions/upload-artifact@v4
        with:
          name: ChessOdyssey-v0.5.0-Masters-Stockfish-PREVIEW
          path: projects/chess-odyssey/dist/ChessOdyssey_v0.5.0_Stockfish_Preview.zip
          if-no-files-found: error
          retention-days: 30
