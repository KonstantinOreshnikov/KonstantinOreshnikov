          node --check projects/independent-game-studio/games/chess-odyssey/tests/b9-http.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/b9-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/b9-match-service.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/b8-translation-structure.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/b8-clock-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/coach-engine.js
          node --check projects/independent-game-studio/games/chess-odyssey/engine-bridge.js
          node --check projects/independent-game-studio/games/chess-odyssey/academy.js
          node --check projects/independent-game-studio/games/chess-odyssey/masters-library.js
          node --check projects/independent-game-studio/games/chess-odyssey/masters-notes-a.js
          node --check projects/independent-game-studio/games/chess-odyssey/masters-notes-b.js
          node --check projects/independent-game-studio/games/chess-odyssey/masters-notes-c.js
          node --check projects/independent-game-studio/games/chess-odyssey/masters-core.js
          node --check projects/independent-game-studio/games/chess-odyssey/masters-ui.js
          node --check projects/independent-game-studio/games/chess-odyssey/progress-core.js
          node --check projects/independent-game-studio/games/chess-odyssey/progress-ui.js
          node --check projects/independent-game-studio/games/chess-odyssey/tests/release-rules.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/release-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/release-live-match-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/release-accessibility.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/progress-content.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/progress-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/masters-content.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/masters-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/academy-content.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/academy-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/scripts/build-standalone.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/scripts/serve-local.cjs
          python3 -m py_compile projects/independent-game-studio/games/chess-odyssey/scripts/package-preview.py
          node --check projects/independent-game-studio/games/chess-odyssey/tests/engine-bridge.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/stockfish-uci.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/stockfish-browser.cjs
          node --check projects/independent-game-studio/games/chess-odyssey/tests/coach-engine.cjs
