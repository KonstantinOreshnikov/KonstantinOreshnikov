name: Independent Game Studio migration smoke
on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/independent-game-studio/**'
      - '.github/workflows/independent-game-studio-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser runner
        run: npm install --no-save --no-audit --no-fund playwright@1.57.0
      - name: Select browser
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHESS_CHROME_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Browser startup and persistence smoke
        run: node projects/independent-game-studio/qa/smoke.cjs
      - name: Build and test Caribbean Merchant v1.2.1 candidate
        run: |
          python projects/independent-game-studio/games/caribbean-merchant/testing/build-v1.2.1.py
          node projects/independent-game-studio/games/caribbean-merchant/testing/v1.2-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: CaribbeanMerchant-v1.2.1-QA
          path: projects/independent-game-studio/games/caribbean-merchant/releases/CaribbeanMerchant_v1.2.1_QA.html
